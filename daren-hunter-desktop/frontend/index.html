<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>达人猎手 v1.0</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <header class="header">
            <h1 class="app-title">达人猎手 v1.0</h1>
            <div class="header-actions">
                <span class="status-indicator" id="backendStatus">
                    <span class="dot"></span>
                    <span class="text">后端服务启动中...</span>
                </span>
            </div>
        </header>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 左侧导航 -->
            <nav class="sidebar">
                <ul class="nav-menu">
                    <li class="nav-item active" data-page="targets">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                        <span>达人管理</span>
                    </li>
                    <li class="nav-item" data-page="templates">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                        <span>话术库</span>
                    </li>
                    <li class="nav-item" data-page="send">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                        <span>发送任务</span>
                    </li>
                    <li class="nav-item" data-page="statistics">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                        <span>数据统计</span>
                    </li>
                    <li class="nav-item" data-page="settings">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                        <span>设置</span>
                    </li>
                </ul>
            </nav>

            <!-- 右侧内容区 -->
            <div class="content-area">
                <!-- 达人管理页面 -->
                <div id="targets-page" class="page active">
                    <div class="page-header">
                        <h2>达人管理</h2>
                        <div class="actions">
                            <button class="btn btn-primary" id="importExcelBtn">导入Excel</button>
                            <button class="btn btn-secondary" id="exportTargetsBtn">导出</button>
                            <button class="btn btn-secondary" id="downloadTemplateBtn">下载模板</button>
                        </div>
                    </div>

                    <div class="toolbar">
                        <div class="search-box">
                            <input type="text" id="searchInput" placeholder="搜索昵称或抖音ID..." />
                        </div>
                        <div class="filter-group">
                            <label>状态筛选：</label>
                            <select id="statusFilter">
                                <option value="">全部</option>
                                <option value="pending">待发送</option>
                                <option value="sent">已发送</option>
                                <option value="replied">已回复</option>
                                <option value="wechat">已加微信</option>
                                <option value="signed">已签约</option>
                                <option value="rejected">已拒绝</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-container">
                        <table class="data-table" id="targetsTable">
                            <thead>
                                <tr>
                                    <th width="40"><input type="checkbox" id="selectAll" /></th>
                                    <th>昵称</th>
                                    <th>抖音ID</th>
                                    <th>粉丝数</th>
                                    <th>标签</th>
                                    <th>状态</th>
                                    <th>创建时间</th>
                                    <th width="120">操作</th>
                                </tr>
                            </thead>
                            <tbody id="targetsTableBody">
                                <tr>
                                    <td colspan="8" class="empty-state">暂无数据，请导入达人信息</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="table-footer">
                        <div class="batch-actions">
                            <button class="btn btn-primary" id="batchSendBtn" disabled>批量发送</button>
                            <button class="btn btn-danger" id="batchDeleteBtn" disabled>批量删除</button>
                            <span class="selected-info" id="selectedInfo">已选：0个</span>
                        </div>
                        <div class="pagination" id="pagination">
                            <!-- 分页将由JS动态生成 -->
                        </div>
                    </div>
                </div>

                <!-- 话术库页面 -->
                <div id="templates-page" class="page">
                    <div class="page-header">
                        <h2>话术库</h2>
                        <div class="actions">
                            <button class="btn btn-primary" id="createTemplateBtn">新建话术</button>
                        </div>
                    </div>

                    <div class="templates-grid" id="templatesGrid">
                        <!-- 话术卡片将由JS动态生成 -->
                    </div>
                </div>

                <!-- 发送任务页面 -->
                <div id="send-page" class="page">
                    <div class="page-header">
                        <h2>发送任务</h2>
                    </div>

                    <div class="send-config-panel" id="sendConfigPanel">
                        <!-- 发送配置将由JS动态生成 -->
                    </div>

                    <div class="send-progress-panel hidden" id="sendProgressPanel">
                        <!-- 发送进度将由JS动态生成 -->
                    </div>
                </div>

                <!-- 数据统计页面 -->
                <div id="statistics-page" class="page">
                    <div class="page-header">
                        <h2>数据统计</h2>
                        <div class="actions">
                            <button class="btn btn-secondary" id="exportReportBtn">导出报表</button>
                        </div>
                    </div>

                    <div class="stats-container" id="statsContainer">
                        <!-- 统计数据将由JS动态生成 -->
                    </div>
                </div>

                <!-- 设置页面 -->
                <div id="settings-page" class="page">
                    <div class="page-header">
                        <h2>设置</h2>
                    </div>

                    <div class="settings-container" id="settingsContainer">
                        <!-- 设置内容将由JS动态生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal容器 -->
    <div id="modalContainer"></div>

    <!-- 加载脚本 -->
    <script src="scripts/api.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/targets.js"></script>
    <script src="scripts/templates.js"></script>
    <script src="scripts/send.js"></script>
    <script src="scripts/statistics.js"></script>
    <script src="scripts/settings.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
