<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逃离鸭科夫 - Escape from Duckoff</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #1a1a1a;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #gameCanvas {
            display: block;
            background: #2d2d2d;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            cursor: crosshair;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        // ==================== 常量定义 ====================
        const CANVAS_WIDTH = 1200;
        const CANVAS_HEIGHT = 800;
        const FPS = 60;
        const MAP_WIDTH = 2400;
        const MAP_HEIGHT = 1600;

        // 玩家常量
        const PLAYER_SIZE = 40;
        const PLAYER_SPEED = 4;
        const PLAYER_MAX_HEALTH = 100;
        const PLAYER_MAX_AMMO = 120;
        const PLAYER_START_AMMO = 30;
        const PLAYER_SHOOT_COOLDOWN = 200; // 毫秒
        const PLAYER_INVULNERABLE_TIME = 500; // 毫秒

        // 子弹常量
        const BULLET_SPEED = 10;
        const BULLET_SIZE = 5;
        const BULLET_DAMAGE = 25;

        // 敌人常量
        const ENEMY_TYPES = {
            patrol: {
                health: 50,
                speed: 2,
                damage: 15,
                attackRange: 200,
                detectionRange: 300,
                color: '#FF6B6B',
                shootCooldown: 1500
            },
            sniper: {
                health: 30,
                speed: 1,
                damage: 30,
                attackRange: 400,
                detectionRange: 500,
                color: '#9B59B6',
                shootCooldown: 2000
            },
            rush: {
                health: 80,
                speed: 5,
                damage: 20,
                attackRange: 50,
                detectionRange: 400,
                color: '#E74C3C',
                shootCooldown: 1000
            }
        };

        // 物品常量
        const ITEM_TYPES = {
            medkit: {
                name: '医疗包',
                color: '#2ECC71',
                size: 25,
                effect: 50
            },
            ammo: {
                name: '弹药箱',
                color: '#F39C12',
                size: 25,
                effect: 30
            },
            treasure: {
                name: '宝箱',
                color: '#FFD700',
                size: 30,
                effect: 100
            }
        };

        const PICKUP_RANGE = 50;
        const EXTRACTION_RANGE = 80;
        const GAME_TIME_LIMIT = 300; // 秒

        // ==================== 游戏类 ====================

        // 粒子类
        class Particle {
            constructor(x, y, color, vx, vy, life) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = vx;
                this.vy = vy;
                this.life = life;
                this.maxLife = life;
                this.size = Math.random() * 3 + 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                this.vx *= 0.95;
                this.vy *= 0.95;
            }

            draw(ctx, camera) {
                const alpha = this.life / this.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.fillRect(
                    this.x - camera.x - this.size / 2,
                    this.y - camera.y - this.size / 2,
                    this.size,
                    this.size
                );
                ctx.globalAlpha = 1;
            }

            isDead() {
                return this.life <= 0;
            }
        }

        // 子弹类
        class Bullet {
            constructor(x, y, angle, owner) {
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angle) * BULLET_SPEED;
                this.vy = Math.sin(angle) * BULLET_SPEED;
                this.size = BULLET_SIZE;
                this.damage = BULLET_DAMAGE;
                this.owner = owner; // 'player' or 'enemy'
                this.color = owner === 'player' ? '#FFF' : '#FF4444';
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
            }

            draw(ctx, camera) {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(
                    this.x - camera.x,
                    this.y - camera.y,
                    this.size,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }

            isOutOfBounds() {
                return this.x < 0 || this.x > MAP_WIDTH ||
                       this.y < 0 || this.y > MAP_HEIGHT;
            }
        }

        // 物品类
        class Item {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.config = ITEM_TYPES[type];
                this.size = this.config.size;
                this.collected = false;
            }

            draw(ctx, camera) {
                if (this.collected) return;

                ctx.fillStyle = this.config.color;
                ctx.strokeStyle = '#FFF';
                ctx.lineWidth = 2;

                // 绘制物品
                if (this.type === 'treasure') {
                    // 宝箱 - 绘制矩形
                    ctx.fillRect(
                        this.x - camera.x - this.size / 2,
                        this.y - camera.y - this.size / 2,
                        this.size,
                        this.size
                    );
                    ctx.strokeRect(
                        this.x - camera.x - this.size / 2,
                        this.y - camera.y - this.size / 2,
                        this.size,
                        this.size
                    );
                } else {
                    // 医疗包和弹药箱 - 绘制圆形
                    ctx.beginPath();
                    ctx.arc(
                        this.x - camera.x,
                        this.y - camera.y,
                        this.size / 2,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                    ctx.stroke();
                }

                // 绘制标识
                ctx.fillStyle = '#FFF';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                const label = this.type === 'medkit' ? '+' :
                             this.type === 'ammo' ? 'A' : '$';
                ctx.fillText(
                    label,
                    this.x - camera.x,
                    this.y - camera.y + 4
                );
            }
        }

        // 障碍物类
        class Obstacle {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
            }

            draw(ctx, camera) {
                ctx.fillStyle = '#424242';
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.fillRect(
                    this.x - camera.x,
                    this.y - camera.y,
                    this.width,
                    this.height
                );
                ctx.strokeRect(
                    this.x - camera.x,
                    this.y - camera.y,
                    this.width,
                    this.height
                );
            }

            collidesWith(x, y, size) {
                return x + size > this.x &&
                       x - size < this.x + this.width &&
                       y + size > this.y &&
                       y - size < this.y + this.height;
            }
        }

        // 玩家类
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = PLAYER_SIZE;
                this.height = PLAYER_SIZE;
                this.speed = PLAYER_SPEED;
                this.health = PLAYER_MAX_HEALTH;
                this.maxHealth = PLAYER_MAX_HEALTH;
                this.ammo = PLAYER_START_AMMO;
                this.maxAmmo = PLAYER_MAX_AMMO;
                this.rotation = 0;
                this.invulnerable = false;
                this.invulnerableTime = 0;
                this.lastShootTime = 0;
                this.score = 0;
                this.kills = 0;
            }

            update(input, obstacles, deltaTime) {
                // 移动
                let dx = 0;
                let dy = 0;

                if (input.w) dy -= 1;
                if (input.s) dy += 1;
                if (input.a) dx -= 1;
                if (input.d) dx += 1;

                // 归一化对角线移动
                if (dx !== 0 && dy !== 0) {
                    dx *= 0.707;
                    dy *= 0.707;
                }

                // 尝试移动并检查碰撞
                const newX = this.x + dx * this.speed;
                const newY = this.y + dy * this.speed;

                let canMoveX = true;
                let canMoveY = true;

                // 检查地图边界
                if (newX - this.width / 2 < 0 || newX + this.width / 2 > MAP_WIDTH) {
                    canMoveX = false;
                }
                if (newY - this.height / 2 < 0 || newY + this.height / 2 > MAP_HEIGHT) {
                    canMoveY = false;
                }

                // 检查障碍物碰撞
                for (const obstacle of obstacles) {
                    if (obstacle.collidesWith(newX, this.y, this.width / 2)) {
                        canMoveX = false;
                    }
                    if (obstacle.collidesWith(this.x, newY, this.height / 2)) {
                        canMoveY = false;
                    }
                }

                if (canMoveX) this.x = newX;
                if (canMoveY) this.y = newY;

                // 更新旋转角度（朝向鼠标）
                this.rotation = Math.atan2(
                    input.mouseY - CANVAS_HEIGHT / 2,
                    input.mouseX - CANVAS_WIDTH / 2
                );

                // 更新无敌时间
                if (this.invulnerable) {
                    this.invulnerableTime -= deltaTime;
                    if (this.invulnerableTime <= 0) {
                        this.invulnerable = false;
                    }
                }
            }

            shoot(currentTime) {
                if (currentTime - this.lastShootTime < PLAYER_SHOOT_COOLDOWN) {
                    return null;
                }

                if (this.ammo <= 0) {
                    return null;
                }

                this.ammo--;
                this.lastShootTime = currentTime;

                // 创建子弹
                const bulletX = this.x + Math.cos(this.rotation) * this.width / 2;
                const bulletY = this.y + Math.sin(this.rotation) * this.height / 2;

                return new Bullet(bulletX, bulletY, this.rotation, 'player');
            }

            takeDamage(damage) {
                if (this.invulnerable) return false;

                this.health -= damage;
                if (this.health <= 0) {
                    this.health = 0;
                    return true; // 死亡
                }

                this.invulnerable = true;
                this.invulnerableTime = PLAYER_INVULNERABLE_TIME;
                return false;
            }

            heal(amount) {
                this.health = Math.min(this.health + amount, this.maxHealth);
            }

            addAmmo(amount) {
                this.ammo = Math.min(this.ammo + amount, this.maxAmmo);
            }

            addScore(points) {
                this.score += points;
            }

            draw(ctx, camera) {
                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(this.rotation);

                // 绘制鸭子身体
                if (this.invulnerable && Math.floor(Date.now() / 100) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }

                ctx.fillStyle = '#FFD700'; // 金色
                ctx.beginPath();
                ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2);
                ctx.fill();

                // 绘制方向指示器
                ctx.fillStyle = '#FFA500'; // 橙色
                ctx.beginPath();
                ctx.moveTo(this.width / 2, 0);
                ctx.lineTo(this.width / 2 - 10, -8);
                ctx.lineTo(this.width / 2 - 10, 8);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        // 敌人类
        class Enemy {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.config = ENEMY_TYPES[type];
                this.health = this.config.health;
                this.maxHealth = this.config.health;
                this.speed = this.config.speed;
                this.state = 'idle';
                this.rotation = Math.random() * Math.PI * 2;
                this.lastShootTime = 0;
                this.hitFlash = 0;
                this.size = 35;
            }

            update(player, obstacles, currentTime, deltaTime) {
                const dx = player.x - this.x;
                const dy = player.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                // 更新朝向
                this.rotation = Math.atan2(dy, dx);

                // AI状态机
                if (distance < this.config.detectionRange) {
                    this.state = 'alert';

                    if (distance > this.config.attackRange) {
                        // 追击玩家
                        const moveX = (dx / distance) * this.speed;
                        const moveY = (dy / distance) * this.speed;

                        // 检查碰撞
                        let canMove = true;
                        const newX = this.x + moveX;
                        const newY = this.y + moveY;

                        for (const obstacle of obstacles) {
                            if (obstacle.collidesWith(newX, newY, this.size / 2)) {
                                canMove = false;
                                break;
                            }
                        }

                        if (canMove) {
                            this.x = newX;
                            this.y = newY;
                        }
                    }
                } else {
                    this.state = 'idle';
                }

                // 更新击中闪烁
                if (this.hitFlash > 0) {
                    this.hitFlash -= deltaTime;
                }
            }

            shoot(player, currentTime) {
                const dx = player.x - this.x;
                const dy = player.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > this.config.attackRange) {
                    return null;
                }

                if (currentTime - this.lastShootTime < this.config.shootCooldown) {
                    return null;
                }

                this.lastShootTime = currentTime;

                // 创建子弹，添加一些不准确性
                const spread = 0.1;
                const angle = this.rotation + (Math.random() - 0.5) * spread;

                return new Bullet(this.x, this.y, angle, 'enemy');
            }

            takeDamage(damage) {
                this.health -= damage;
                this.hitFlash = 100;
                return this.health <= 0;
            }

            draw(ctx, camera) {
                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(this.rotation);

                // 绘制敌人身体
                const color = this.hitFlash > 0 ? '#FFF' : this.config.color;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                ctx.fill();

                // 绘制方向指示器
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.moveTo(this.size / 2, 0);
                ctx.lineTo(this.size / 2 - 8, -6);
                ctx.lineTo(this.size / 2 - 8, 6);
                ctx.closePath();
                ctx.fill();

                ctx.restore();

                // 绘制血条
                if (this.health < this.maxHealth) {
                    const barWidth = 40;
                    const barHeight = 4;
                    const healthPercent = this.health / this.maxHealth;

                    ctx.fillStyle = '#333';
                    ctx.fillRect(
                        screenX - barWidth / 2,
                        screenY - this.size / 2 - 10,
                        barWidth,
                        barHeight
                    );

                    ctx.fillStyle = '#FF4444';
                    ctx.fillRect(
                        screenX - barWidth / 2,
                        screenY - this.size / 2 - 10,
                        barWidth * healthPercent,
                        barHeight
                    );
                }
            }
        }

        // 撤离点类
        class ExtractionPoint {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = EXTRACTION_RANGE;
                this.pulsePhase = 0;
            }

            update(deltaTime) {
                this.pulsePhase += deltaTime * 0.003;
            }

            draw(ctx, camera) {
                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                // 脉冲效果
                const pulse = Math.sin(this.pulsePhase) * 0.2 + 0.8;
                const currentRadius = this.radius * pulse;

                // 绘制外圈
                ctx.strokeStyle = '#2ECC71';
                ctx.lineWidth = 3;
                ctx.globalAlpha = pulse * 0.5;
                ctx.beginPath();
                ctx.arc(screenX, screenY, currentRadius, 0, Math.PI * 2);
                ctx.stroke();

                // 绘制内圈
                ctx.globalAlpha = 0.3;
                ctx.fillStyle = '#2ECC71';
                ctx.beginPath();
                ctx.arc(screenX, screenY, currentRadius * 0.8, 0, Math.PI * 2);
                ctx.fill();

                ctx.globalAlpha = 1;

                // 绘制标记
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('撤离点', screenX, screenY - 5);
                ctx.fillText('EXTRACTION', screenX, screenY + 10);
            }

            isPlayerInRange(player) {
                const dx = player.x - this.x;
                const dy = player.y - this.y;
                return Math.sqrt(dx * dx + dy * dy) < this.radius;
            }
        }

        // ==================== 游戏管理器 ====================
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.canvas.width = CANVAS_WIDTH;
                this.canvas.height = CANVAS_HEIGHT;

                this.state = 'START';
                this.player = null;
                this.enemies = [];
                this.bullets = [];
                this.items = [];
                this.obstacles = [];
                this.particles = [];
                this.extractionPoint = null;

                this.camera = { x: 0, y: 0 };
                this.input = {
                    w: false,
                    a: false,
                    s: false,
                    d: false,
                    e: false,
                    mouseX: 0,
                    mouseY: 0,
                    mouseDown: false,
                    escape: false
                };

                this.gameTime = 0;
                this.startTime = 0;
                this.lastTime = 0;
                this.damageFlash = 0;

                this.setupInput();
                this.gameLoop();
            }

            setupInput() {
                // 键盘输入
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'w' || e.key === 'W') this.input.w = true;
                    if (e.key === 'a' || e.key === 'A') this.input.a = true;
                    if (e.key === 's' || e.key === 'S') this.input.s = true;
                    if (e.key === 'd' || e.key === 'D') this.input.d = true;
                    if (e.key === 'e' || e.key === 'E') this.input.e = true;

                    if (e.key === 'Escape') {
                        if (this.state === 'PLAYING') {
                            this.state = 'PAUSED';
                        } else if (this.state === 'PAUSED') {
                            this.state = 'PLAYING';
                        }
                    }

                    if (e.key === ' ' && this.state === 'START') {
                        this.startGame();
                    }
                });

                window.addEventListener('keyup', (e) => {
                    if (e.key === 'w' || e.key === 'W') this.input.w = false;
                    if (e.key === 'a' || e.key === 'A') this.input.a = false;
                    if (e.key === 's' || e.key === 'S') this.input.s = false;
                    if (e.key === 'd' || e.key === 'D') this.input.d = false;
                    if (e.key === 'e' || e.key === 'E') this.input.e = false;
                });

                // 鼠标输入
                this.canvas.addEventListener('mousemove', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.input.mouseX = e.clientX - rect.left;
                    this.input.mouseY = e.clientY - rect.top;
                });

                this.canvas.addEventListener('mousedown', (e) => {
                    this.input.mouseDown = true;

                    if (this.state === 'START') {
                        this.startGame();
                    } else if (this.state === 'WIN' || this.state === 'LOSE') {
                        this.startGame();
                    }
                });

                this.canvas.addEventListener('mouseup', () => {
                    this.input.mouseDown = false;
                });
            }

            startGame() {
                this.state = 'PLAYING';
                this.gameTime = 0;
                this.startTime = Date.now();

                // 初始化玩家
                this.player = new Player(MAP_WIDTH / 2, MAP_HEIGHT / 2);

                // 清空数组
                this.enemies = [];
                this.bullets = [];
                this.items = [];
                this.obstacles = [];
                this.particles = [];

                // 生成障碍物
                this.spawnObstacles();

                // 生成敌人
                this.spawnEnemies();

                // 生成物品
                this.spawnItems();

                // 生成撤离点
                this.spawnExtractionPoint();
            }

            spawnObstacles() {
                const count = 20;
                for (let i = 0; i < count; i++) {
                    const width = Math.random() * 150 + 50;
                    const height = Math.random() * 150 + 50;
                    const x = Math.random() * (MAP_WIDTH - width);
                    const y = Math.random() * (MAP_HEIGHT - height);

                    // 避免在玩家起始位置生成
                    const dx = x - MAP_WIDTH / 2;
                    const dy = y - MAP_HEIGHT / 2;
                    if (Math.sqrt(dx * dx + dy * dy) > 200) {
                        this.obstacles.push(new Obstacle(x, y, width, height));
                    }
                }
            }

            spawnEnemies() {
                const types = ['patrol', 'patrol', 'patrol', 'patrol', 'patrol',
                             'sniper', 'sniper', 'sniper',
                             'rush', 'rush'];

                for (const type of types) {
                    let x, y;
                    let validPosition = false;

                    while (!validPosition) {
                        x = Math.random() * MAP_WIDTH;
                        y = Math.random() * MAP_HEIGHT;

                        // 避免在玩家附近生成
                        const dx = x - this.player.x;
                        const dy = y - this.player.y;
                        if (Math.sqrt(dx * dx + dy * dy) > 400) {
                            validPosition = true;
                        }
                    }

                    this.enemies.push(new Enemy(x, y, type));
                }
            }

            spawnItems() {
                // 医疗包
                for (let i = 0; i < 4; i++) {
                    const x = Math.random() * MAP_WIDTH;
                    const y = Math.random() * MAP_HEIGHT;
                    this.items.push(new Item(x, y, 'medkit'));
                }

                // 弹药箱
                for (let i = 0; i < 5; i++) {
                    const x = Math.random() * MAP_WIDTH;
                    const y = Math.random() * MAP_HEIGHT;
                    this.items.push(new Item(x, y, 'ammo'));
                }

                // 宝箱
                for (let i = 0; i < 3; i++) {
                    const x = Math.random() * MAP_WIDTH;
                    const y = Math.random() * MAP_HEIGHT;
                    this.items.push(new Item(x, y, 'treasure'));
                }
            }

            spawnExtractionPoint() {
                // 在地图边缘随机生成撤离点
                const side = Math.floor(Math.random() * 4);
                let x, y;

                switch (side) {
                    case 0: // 上
                        x = Math.random() * MAP_WIDTH;
                        y = 100;
                        break;
                    case 1: // 右
                        x = MAP_WIDTH - 100;
                        y = Math.random() * MAP_HEIGHT;
                        break;
                    case 2: // 下
                        x = Math.random() * MAP_WIDTH;
                        y = MAP_HEIGHT - 100;
                        break;
                    case 3: // 左
                        x = 100;
                        y = Math.random() * MAP_HEIGHT;
                        break;
                }

                this.extractionPoint = new ExtractionPoint(x, y);
            }

            update(deltaTime) {
                if (this.state !== 'PLAYING') return;

                const currentTime = Date.now();
                this.gameTime = (currentTime - this.startTime) / 1000;

                // 检查时间限制
                if (this.gameTime >= GAME_TIME_LIMIT) {
                    this.state = 'LOSE';
                    return;
                }

                // 更新玩家
                this.player.update(this.input, this.obstacles, deltaTime);

                // 射击
                if (this.input.mouseDown) {
                    const bullet = this.player.shoot(currentTime);
                    if (bullet) {
                        this.bullets.push(bullet);
                        this.createMuzzleFlash(bullet.x, bullet.y, this.player.rotation);
                    }
                }

                // 更新敌人
                for (const enemy of this.enemies) {
                    enemy.update(this.player, this.obstacles, currentTime, deltaTime);

                    const bullet = enemy.shoot(this.player, currentTime);
                    if (bullet) {
                        this.bullets.push(bullet);
                    }
                }

                // 更新子弹
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    this.bullets[i].update();

                    if (this.bullets[i].isOutOfBounds()) {
                        this.bullets.splice(i, 1);
                    }
                }

                // 更新粒子
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    this.particles[i].update();
                    if (this.particles[i].isDead()) {
                        this.particles.splice(i, 1);
                    }
                }

                // 更新撤离点
                this.extractionPoint.update(deltaTime);

                // 碰撞检测
                this.checkCollisions();

                // 检查物品拾取
                if (this.input.e) {
                    this.checkItemPickup();
                }

                // 检查撤离
                if (this.input.e && this.extractionPoint.isPlayerInRange(this.player)) {
                    this.state = 'WIN';
                }

                // 更新相机
                this.updateCamera();

                // 更新伤害闪烁
                if (this.damageFlash > 0) {
                    this.damageFlash -= deltaTime;
                }
            }

            checkCollisions() {
                // 子弹与敌人
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const bullet = this.bullets[i];

                    if (bullet.owner === 'player') {
                        for (let j = this.enemies.length - 1; j >= 0; j--) {
                            const enemy = this.enemies[j];
                            const dx = bullet.x - enemy.x;
                            const dy = bullet.y - enemy.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);

                            if (distance < enemy.size / 2 + bullet.size) {
                                // 击中
                                const died = enemy.takeDamage(bullet.damage);
                                this.createHitEffect(bullet.x, bullet.y, '#FF4444');
                                this.bullets.splice(i, 1);

                                if (died) {
                                    this.enemies.splice(j, 1);
                                    this.player.kills++;
                                    this.player.addScore(50);
                                }
                                break;
                            }
                        }
                    } else if (bullet.owner === 'enemy') {
                        const dx = bullet.x - this.player.x;
                        const dy = bullet.y - this.player.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < this.player.width / 2 + bullet.size) {
                            // 击中玩家
                            const died = this.player.takeDamage(bullet.damage);
                            this.createHitEffect(bullet.x, bullet.y, '#FF0000');
                            this.damageFlash = 200;
                            this.bullets.splice(i, 1);

                            if (died) {
                                this.state = 'LOSE';
                            }
                        }
                    }
                }
            }

            checkItemPickup() {
                for (let i = this.items.length - 1; i >= 0; i--) {
                    const item = this.items[i];
                    if (item.collected) continue;

                    const dx = this.player.x - item.x;
                    const dy = this.player.y - item.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < PICKUP_RANGE) {
                        // 拾取物品
                        item.collected = true;

                        switch (item.type) {
                            case 'medkit':
                                this.player.heal(item.config.effect);
                                break;
                            case 'ammo':
                                this.player.addAmmo(item.config.effect);
                                break;
                            case 'treasure':
                                this.player.addScore(item.config.effect);
                                break;
                        }

                        this.createPickupEffect(item.x, item.y, item.config.color);
                        this.items.splice(i, 1);
                    }
                }
            }

            updateCamera() {
                // 相机跟随玩家
                this.camera.x = this.player.x - CANVAS_WIDTH / 2;
                this.camera.y = this.player.y - CANVAS_HEIGHT / 2;

                // 限制相机范围
                this.camera.x = Math.max(0, Math.min(this.camera.x, MAP_WIDTH - CANVAS_WIDTH));
                this.camera.y = Math.max(0, Math.min(this.camera.y, MAP_HEIGHT - CANVAS_HEIGHT));
            }

            createMuzzleFlash(x, y, angle) {
                for (let i = 0; i < 5; i++) {
                    const speed = Math.random() * 2 + 1;
                    const spreadAngle = angle + (Math.random() - 0.5) * 0.5;
                    const vx = Math.cos(spreadAngle) * speed;
                    const vy = Math.sin(spreadAngle) * speed;
                    this.particles.push(new Particle(x, y, '#FFF', vx, vy, 10));
                }
            }

            createHitEffect(x, y, color) {
                for (let i = 0; i < 8; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 3 + 1;
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed;
                    this.particles.push(new Particle(x, y, color, vx, vy, 20));
                }
            }

            createPickupEffect(x, y, color) {
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2;
                    const speed = Math.random() * 2 + 2;
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed;
                    this.particles.push(new Particle(x, y, color, vx, vy, 30));
                }
            }

            render() {
                const ctx = this.ctx;

                // 清空画布
                ctx.fillStyle = '#2d2d2d';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                if (this.state === 'START') {
                    this.renderStartScreen();
                    return;
                }

                if (this.state === 'PLAYING' || this.state === 'PAUSED') {
                    this.renderGame();

                    if (this.state === 'PAUSED') {
                        this.renderPauseScreen();
                    }
                    return;
                }

                if (this.state === 'WIN' || this.state === 'LOSE') {
                    this.renderGame();
                    this.renderEndScreen();
                    return;
                }
            }

            renderGame() {
                const ctx = this.ctx;

                // 绘制地图背景
                ctx.fillStyle = '#7CB342';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                // 绘制网格
                ctx.strokeStyle = '#689F38';
                ctx.lineWidth = 1;
                const gridSize = 50;
                const startX = Math.floor(this.camera.x / gridSize) * gridSize;
                const startY = Math.floor(this.camera.y / gridSize) * gridSize;

                for (let x = startX; x < this.camera.x + CANVAS_WIDTH; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x - this.camera.x, 0);
                    ctx.lineTo(x - this.camera.x, CANVAS_HEIGHT);
                    ctx.stroke();
                }

                for (let y = startY; y < this.camera.y + CANVAS_HEIGHT; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y - this.camera.y);
                    ctx.lineTo(CANVAS_WIDTH, y - this.camera.y);
                    ctx.stroke();
                }

                // 绘制障碍物
                for (const obstacle of this.obstacles) {
                    obstacle.draw(ctx, this.camera);
                }

                // 绘制撤离点
                this.extractionPoint.draw(ctx, this.camera);

                // 绘制物品
                for (const item of this.items) {
                    item.draw(ctx, this.camera);
                }

                // 绘制子弹
                for (const bullet of this.bullets) {
                    bullet.draw(ctx, this.camera);
                }

                // 绘制粒子
                for (const particle of this.particles) {
                    particle.draw(ctx, this.camera);
                }

                // 绘制敌人
                for (const enemy of this.enemies) {
                    enemy.draw(ctx, this.camera);
                }

                // 绘制玩家
                this.player.draw(ctx, this.camera);

                // 绘制伤害闪烁
                if (this.damageFlash > 0) {
                    ctx.strokeStyle = '#FF0000';
                    ctx.lineWidth = 8;
                    ctx.globalAlpha = this.damageFlash / 200;
                    ctx.strokeRect(5, 5, CANVAS_WIDTH - 10, CANVAS_HEIGHT - 10);
                    ctx.globalAlpha = 1;
                }

                // 绘制HUD
                this.renderHUD();
            }

            renderHUD() {
                const ctx = this.ctx;

                // 左上角 - 生命值和弹药
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(10, 10, 300, 100);

                // 生命值条
                ctx.fillStyle = '#333';
                ctx.fillRect(20, 20, 280, 25);

                const healthPercent = this.player.health / this.player.maxHealth;
                ctx.fillStyle = healthPercent > 0.5 ? '#2ECC71' :
                               healthPercent > 0.25 ? '#F39C12' : '#E74C3C';
                ctx.fillRect(20, 20, 280 * healthPercent, 25);

                ctx.strokeStyle = '#FFF';
                ctx.lineWidth = 2;
                ctx.strokeRect(20, 20, 280, 25);

                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 14px Arial';
                ctx.fillText(`生命值: ${Math.ceil(this.player.health)}/${this.player.maxHealth}`, 25, 38);

                // 弹药
                ctx.font = '16px Arial';
                ctx.fillText(`弹药: ${this.player.ammo}/${this.player.maxAmmo}`, 25, 65);

                // 时间
                const timeLeft = Math.max(0, GAME_TIME_LIMIT - this.gameTime);
                const minutes = Math.floor(timeLeft / 60);
                const seconds = Math.floor(timeLeft % 60);
                ctx.fillText(`时间: ${minutes}:${seconds.toString().padStart(2, '0')}`, 25, 90);

                // 右上角 - 得分和击杀
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(CANVAS_WIDTH - 210, 10, 200, 80);

                ctx.fillStyle = '#FFF';
                ctx.font = '16px Arial';
                ctx.textAlign = 'right';
                ctx.fillText(`得分: ${this.player.score}`, CANVAS_WIDTH - 20, 35);
                ctx.fillText(`击杀: ${this.player.kills}`, CANVAS_WIDTH - 20, 60);
                ctx.fillText(`敌人: ${this.enemies.length}`, CANVAS_WIDTH - 20, 85);
                ctx.textAlign = 'left';

                // 提示文字
                let hint = '';

                // 检查是否靠近物品
                for (const item of this.items) {
                    const dx = this.player.x - item.x;
                    const dy = this.player.y - item.y;
                    if (Math.sqrt(dx * dx + dy * dy) < PICKUP_RANGE) {
                        hint = `按 E 拾取 ${item.config.name}`;
                        break;
                    }
                }

                // 检查是否在撤离点
                if (this.extractionPoint.isPlayerInRange(this.player)) {
                    hint = '按 E 撤离';
                }

                if (hint) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(CANVAS_WIDTH / 2 - 120, CANVAS_HEIGHT - 60, 240, 40);

                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 18px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(hint, CANVAS_WIDTH / 2, CANVAS_HEIGHT - 32);
                    ctx.textAlign = 'left';
                }
            }

            renderStartScreen() {
                const ctx = this.ctx;

                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                // 标题
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 72px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('逃离鸭科夫', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 150);

                ctx.fillStyle = '#FFF';
                ctx.font = '24px Arial';
                ctx.fillText('ESCAPE FROM DUCKOFF', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 100);

                // 副标题
                ctx.font = '18px Arial';
                ctx.fillStyle = '#AAA';
                ctx.fillText('收集物资, 消灭敌人, 找到撤离点!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 50);

                // 开始按钮
                ctx.fillStyle = '#2ECC71';
                ctx.fillRect(CANVAS_WIDTH / 2 - 100, CANVAS_HEIGHT / 2, 200, 50);
                ctx.fillStyle = '#000';
                ctx.font = 'bold 24px Arial';
                ctx.fillText('开始游戏', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 35);

                ctx.fillStyle = '#888';
                ctx.font = '14px Arial';
                ctx.fillText('(点击鼠标或按空格键)', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 70);

                // 操作说明
                ctx.fillStyle = '#FFF';
                ctx.font = '16px Arial';
                ctx.textAlign = 'left';

                const instructions = [
                    'WASD - 移动',
                    '鼠标 - 瞄准',
                    '左键 - 射击',
                    'E - 拾取物品 / 撤离',
                    'ESC - 暂停'
                ];

                let y = CANVAS_HEIGHT / 2 + 120;
                for (const instruction of instructions) {
                    ctx.fillText(instruction, CANVAS_WIDTH / 2 - 100, y);
                    y += 30;
                }

                ctx.textAlign = 'center';
            }

            renderPauseScreen() {
                const ctx = this.ctx;

                // 半透明遮罩
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('游戏暂停', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 50);

                ctx.font = '20px Arial';
                ctx.fillText('按 ESC 继续游戏', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 20);

                // 重新开始按钮
                ctx.fillStyle = '#E74C3C';
                ctx.fillRect(CANVAS_WIDTH / 2 - 100, CANVAS_HEIGHT / 2 + 60, 200, 50);
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 20px Arial';
                ctx.fillText('重新开始 (点击)', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 92);

                ctx.textAlign = 'left';
            }

            renderEndScreen() {
                const ctx = this.ctx;

                // 半透明遮罩
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                ctx.textAlign = 'center';

                if (this.state === 'WIN') {
                    ctx.fillStyle = '#2ECC71';
                    ctx.font = 'bold 64px Arial';
                    ctx.fillText('成功撤离!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 100);

                    ctx.fillStyle = '#FFF';
                    ctx.font = '24px Arial';
                    ctx.fillText('任务完成!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 50);
                } else {
                    ctx.fillStyle = '#E74C3C';
                    ctx.font = 'bold 64px Arial';
                    ctx.fillText('任务失败', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 100);

                    ctx.fillStyle = '#FFF';
                    ctx.font = '24px Arial';
                    const reason = this.player.health <= 0 ? '生命值耗尽' : '时间耗尽';
                    ctx.fillText(reason, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 50);
                }

                // 统计信息
                ctx.fillStyle = '#FFF';
                ctx.font = '20px Arial';
                const survivalTime = Math.floor(this.gameTime);
                const minutes = Math.floor(survivalTime / 60);
                const seconds = survivalTime % 60;

                ctx.fillText(`得分: ${this.player.score}`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 20);
                ctx.fillText(`击杀: ${this.player.kills}`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 50);
                ctx.fillText(`存活时间: ${minutes}:${seconds.toString().padStart(2, '0')}`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 80);

                // 重试按钮
                ctx.fillStyle = '#3498db';
                ctx.fillRect(CANVAS_WIDTH / 2 - 100, CANVAS_HEIGHT / 2 + 120, 200, 50);
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 24px Arial';
                ctx.fillText('再来一局', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 155);

                ctx.textAlign = 'left';
            }

            gameLoop() {
                const currentTime = Date.now();
                const deltaTime = currentTime - this.lastTime;
                this.lastTime = currentTime;

                this.update(deltaTime);
                this.render();

                requestAnimationFrame(() => this.gameLoop());
            }
        }

        // 启动游戏
        window.addEventListener('load', () => {
            new Game();
        });
    </script>
</body>
</html>
